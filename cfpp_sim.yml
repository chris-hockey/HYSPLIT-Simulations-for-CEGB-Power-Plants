name: cfpp_sim

channels:
  - conda-forge

dependencies:
  - python=3.10.20
  - pip=26.0.1

  # Direct Python dependencies
  - numpy=2.2.6
  - pandas=2.3.3
  - xarray=2025.6.1
  - matplotlib=3.10.8
  - statsmodels=0.14.6
  - cdsapi=0.7.7

  # NetCDF and GRIB backends used by Xarray
  - netcdf4=1.7.4
  - cfgrib=0.9.15.1

  # GRIB command-line utilities
  - eccodes=2.46.0

  # Packages installed via pip: pyfixest and every package pip installed
  # alongside it, pinned to the versions in the original environment
  - pip:
      - pyfixest==0.60.0
      - asttokens==3.0.2
      - babel==2.18.0
      - decorator==5.3.1
      - exceptiongroup==1.3.1
      - executing==2.2.1
      - faicons==0.2.2
      - formulaic==1.2.2
      - great-tables==0.23.0
      - htmltools==0.7.0
      - importlib-metadata==9.0.0
      - importlib-resources==7.1.0
      - interface-meta==2.0.1
      - ipython==8.39.0
      - jedi==0.20.0
      - joblib==1.5.3
      - lxml==6.1.2
      - maketables==0.1.8
      - matplotlib-inline==0.2.2
      - multimark==0.3.2
      - narwhals==2.25.0
      - nokap==0.1.0
      - parso==0.8.7
      - pexpect==4.9.0
      - prompt-toolkit==3.0.53
      - ptyprocess==0.7.0
      - pure-eval==0.2.3
      - pygments==2.21.0
      - python-docx==1.2.0
      - seaborn==0.13.2
      - stack-data==0.6.3
      - tabulate==0.10.0
      - traitlets==5.16.1
      - wcwidth==0.8.2
      - websockets==16.1.1
      - wrapt==2.3.0
      - zipp==4.1.0