name: cfpp_sim

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10.20
  - pip=26.0.1

  # Direct Python dependencies
  - numpy=2.2.6
  - pandas=2.3.3
  - xarray=2025.6.1
  - matplotlib=3.10.8
  - statsmodels=0.14.6
  - cdsapi=0.7.7

  # Xarray GRIB backend
  - cfgrib=0.9.15.1

  # GRIB command-line utilities
  - eccodes=2.46.0

  # Packages installed via pip
  - pip:
      - pyfixest==0.60.0